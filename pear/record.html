<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RX-1715 // 介质解析终端 - SAFE-HOUSE-04</title>
    <style>
        /* 导入怨灵字体 */
        @font-face {
            font-family: 'Onryou';
            src: url('onryou.TTF') format('truetype');
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: "Courier New", Courier, monospace; color: #10b981; }
        
        /* 阶段一：开局播放按钮 */
        #boot-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; transition: opacity 1s ease; }
        #play-btn { background: transparent; border: 2px solid #10b981; color: #10b981; padding: 15px 30px; font-family: inherit; font-size: 16px; cursor: pointer; transition: all 0.3s; font-weight: bold; letter-spacing: 2px; }
        #play-btn:hover { background: #10b981; color: #000; box-shadow: 0 0 20px rgba(16, 185, 129, 0.5); }

        /* 阶段二：听写记录终端 */
        #terminal-screen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 800px; height: 80%; display: none; flex-direction: column; justify-content: flex-start; z-index: 50; }
        .log-line { margin-bottom: 22px; font-size: 15px; line-height: 1.8; opacity: 1; transform: translateY(0); transition: none; font-weight: bold; }
        .log-system { color: #52525b; font-style: italic; font-weight: normal; }
        .log-warning { color: #ef4444; font-weight: bold; text-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }

        /* 阶段三：MTF 勘探报告 */
        #mtf-screen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; max-width: 700px; display: none; flex-direction: column; z-index: 150; }
        .mtf-text { color: #d4d4d8; font-size: 15px; line-height: 2.2; text-shadow: none; margin-bottom: 12px; font-weight: bold; }

        /* 阶段四：LIDAR 手电筒探秘墙壁 */
        #flashlight-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 200; display: none; background: #000; cursor: none; }
        
        .wall-texture { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" opacity="0.08"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.6"/></filter><rect width="100" height="100" filter="url(%23n)"/></svg>');
            clip-path: circle(0px at var(--x, 50%) var(--y, 50%)); 
            transition: clip-path 0.05s linear; 
        }

        /* 繁体血字样式：纯红系、无任何框、强烈阴影震慑感 */
        .scrawled-text { 
            position: absolute; 
            font-family: 'Onryou', 'STKaiti', 'KaiTi', serif; 
            opacity: 0.9; font-weight: bold; 
            white-space: nowrap; 
        }
        .scrawl-1 { top: 22%; left: 15%; font-size: 85px; transform: rotate(-6deg); color: #7f1d1d; text-shadow: 3px 3px 15px #000, 0 0 25px rgba(127,29,29,0.5); }
        .scrawl-2 { top: 58%; left: 55%; font-size: 75px; transform: rotate(10deg); color: #991b1b; text-shadow: 3px 3px 15px #000, 0 0 25px rgba(153,27,27,0.6); }
        .scrawl-3 { top: 40%; left: 40%; font-size: 95px; transform: rotate(-4deg); color: #b91c1c; text-shadow: 4px 4px 20px #000, 0 0 30px rgba(185,28,28,0.7); }
        .scrawl-4 { top: 82%; left: 15%; font-size: 65px; transform: rotate(2deg); letter-spacing: 4px; color: #dc2626; text-shadow: 3px 3px 15px #000, 0 0 35px rgba(220,38,38,0.9); }
        
        #flashlight-cursor { position: fixed; pointer-events: none; width: 350px; height: 350px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.03); transform: translate(-50%, -50%); z-index: 210; box-shadow: inset 0 0 100px rgba(255,255,255,0.05); }

    </style>
</head>
<body>

    <div id="boot-screen">
        <div style="font-size:12px; color:#3f6153; letter-spacing:2px; margin-bottom:26px; text-align:center; line-height:2;">
            RX-1715 // 非常规磁性介质解析终端<br>
            所在节点：SAFE-HOUSE-04（封存中） · 远程会话已建立<br>
            <span style="color:#8a3b3b;">读取磁头上残留一卷未退出的磁带。氧化损毁率 61%。最后一次写入：1991-██-██。</span>
        </div>
        <button id="play-btn">[ 降速读取并播放该磁带 ]</button>
        <div style="font-size:11px; color:#274237; margin-top:20px; letter-spacing:1px;">// 解析过程不可暂停。建议佩戴监听装置。</div>
    </div>

    <div id="terminal-screen"></div>

    <div id="mtf-screen"></div>

    <div id="flashlight-screen">
        <div id="exit-link" style="position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:220; font-size:12.5px; letter-spacing:1.5px; opacity:0; transition:opacity 3s ease; text-align:center; line-height:2.2;">
            <div style="color:#3f6153;">[ 磁带末端检测到一段完好的附加数据：深空监控阵列·观测席凭证（注册日期：1991-██-██，启用记录：0 次） ]</div>
            <a href="array.html" style="color:#10b981; text-decoration:none; border-bottom:1px solid #10b981; padding-bottom:3px;">[ 以该凭证接入深空监控阵列 ]</a>
        </div>
        <div class="wall-texture" id="wall">
            <div class="scrawled-text scrawl-1">它 來 了</div>
            <div class="scrawled-text scrawl-2">千 萬 不 要 回 頭</div>
            <div class="scrawled-text scrawl-3">我 們 無 法 阻 止 它</div>
            <div class="scrawled-text scrawl-4"> P O I R E</div>
        </div>
        <div id="flashlight-cursor"></div>
    </div>

    <script>
        // ==================== 音效模组封装 ====================
        const sfx = {
            breathe: new Audio('breathe.mp3'),
            door: new Audio('door.mp3')
        };
        const stepSounds = ['st1.mp3', 'st2.mp3', 'st3.mp3'];

        function playSfx(filename, volume) {
            const audio = new Audio(filename);
            audio.volume = Math.max(0, Math.min(1, volume)); 
            audio.play().catch(()=>{});
        }

        // 步步紧逼：连续脚步声合成器
        async function playWalkingSequence(steps, baseInterval, startVol, endVol) {
            const volStep = (endVol - startVol) / (steps - 1 || 1);
            for (let i = 0; i < steps; i++) {
                const soundFile = stepSounds[i % 3]; 
                const currentVol = startVol + (volStep * i);
                playSfx(soundFile, currentVol);
                const actualInterval = baseInterval + (Math.random() * 60 - 30);
                await new Promise(r => setTimeout(r, actualInterval));
            }
        }

        // ==================== 原生高频单击打字音效 ====================
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        
        function playSingleType() {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.type = 'square'; osc.frequency.setValueAtTime(140 + Math.random()*40, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        }

        // ==================== [高阶同步] 双倍速逐字打字算法 ====================
        async function typeCharacterByCharacter(element, text, speedMultiplier = 0.5) {
            let currentDisplay = "";
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                currentDisplay += char;
                element.innerText = currentDisplay;
                
                // 执行字音绝对同步
                playSingleType();
                
                // 双倍速的核心时间间隔（压缩至 40ms - 75ms）
                let delay = (40 + Math.random() * 35) * speedMultiplier; 
                
                // 缩短标点符号的停顿，维持双倍速的高频推进感
                if (['。', '！', '？', '.', '!', '?'].includes(char)) delay += 350;
                if (['，', ',', '、', '：', '...'].includes(char)) delay += 180;
                
                await new Promise(r => setTimeout(r, delay));
            }
        }

        // ==================== 大幅扩充的绝密剧情脚本 (简体) ====================
        const scriptData = [
            { text: "> 磁带降速读取中。介质氧化损毁率 61%，已跳过 3 段不可恢复内容。以下为可解析部分。", type: "system", delay: 500 },

            { action: "breathe", vol: 0.6 },
            { text: "[ 录音 ]： ……好了，在录了。这里是首席研究员James Klay。", type: "normal", delay: 600 },
            { text: "[ 录音 ]： 现在是12点56分。地下四层已经和上面断开了。四台现实锚在五分钟里挨个熄掉，我感觉我的时间已经所剩不多了。", type: "normal", delay: 700 },

            { action: "walk", steps: 5, interval: 700, startVol: 0.1, endVol: 0.25 },
            { text: "[系统信息：主收容区隔离闸记录到连续冲击，形变率 37%]", type: "system", delay: 800 },

            { text: "[ 录音 ]： 又是那个声音。走廊里没有人，监控里也没有人，但是传感器能感觉到它。", type: "normal", delay: 600 },
            { text: "[ 录音 ]： 我们从一开始就理解错了。那台机器不生产任何东西。它只负责接收输入。问题在于，输入可以来自两个方向。我们这面和它们这面。", type: "warning", delay: 800 },

            { action: "walk", steps: 6, interval: 550, startVol: 0.3, endVol: 0.55 },
            { text: "[ 录音 ]： 门在变形。不是被撞的那种变形，是那种长度和宽度都在不停变换的感觉。咳咳，听脚步，我大概还有1分钟。", type: "warning", delay: 700 },

            { action: "walk", steps: 7, interval: 450, startVol: 0.6, endVol: 0.85 },
            { text: "[ 录音 ]： 两件事，按顺序说。第一件：数据库没了。任何通电的载体都靠不住，它读得懂一切被写下的电信号。所以那串终止序列，我会写在隔离舱最里面的墙上，找到它。", type: "normal", delay: 600 },
            { text: "[ 录音 ]： 第二件：上个月，我以私人名义申请了深空阵列的观测席。我一直想知道它在跟哪里通信……申请昨天才批下来。太迟了，我用不上了。凭证我封在这卷磁带的末端。替我去看一眼。", type: "normal", delay: 800 },

            { action: "walk", steps: 4, interval: 500, startVol: 0.9, endVol: 1.0 },
            { text: "[ 录音 ]： 它到门口了。停住了。……听这卷带子的人，不管你是谁：不要碰那根摇杆，不要与它对视太久。序列在墙上。就在——", type: "warning", delay: 50 },

            { action: "breathe", vol: 1.0 },
            { action: "door" }
        ];

        // 特遣队报告 (简体)
        const mtfData = [
            "[ 磁带主内容至此中断。以下为随介质一同封存的书面附件，同步显示。 ]",
            "机动特遣队现场勘探记录（节选）：",
            "在结构完全损毁的 C-4 隔离舱内，未发现录音人的遗体，亦未检出与其相符的生物残留。",
            "舱体最深处的墙面因未知高温整体琉璃化。琉璃层之下，封存着数行以血书写的文字。",
            "正在接入附属机动特遣队的头戴监视器。"
        ];

        // ==================== 核心控制流 ====================
        const termScreen = document.getElementById('terminal-screen');
        const mtfScreen = document.getElementById('mtf-screen');
        const flashScreen = document.getElementById('flashlight-screen');
        const wall = document.getElementById('wall');
        const flashCursor = document.getElementById('flashlight-cursor');

        document.getElementById('play-btn').addEventListener('click', async function() {
            try { document.documentElement.requestFullscreen(); } catch(e){}
            initAudio();
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('boot-screen').style.display = 'none';
                termScreen.style.display = 'flex';
                runAudioLog();
            }, 1000);
        });

        async function runAudioLog() {
            for (let item of scriptData) {
                if (item.action) {
                    if (item.action === "breathe") { 
                        sfx.breathe.volume = item.vol; sfx.breathe.play().catch(()=>{}); 
                        await new Promise(r => setTimeout(r, 2200)); 
                    }
                    else if (item.action === "walk") {
                        await playWalkingSequence(item.steps, item.interval, item.startVol, item.endVol);
                    }
                    else if (item.action === "door") {
                        sfx.door.volume = 1.0; sfx.door.play().catch(()=>{});
                        termScreen.style.display = 'none';
                        sfx.breathe.pause(); 
                        await new Promise(r => setTimeout(r, 3000)); 
                        runMTFSequence();
                        break; 
                    }
                    continue;
                }

                const div = document.createElement('div');
                div.className = `log-line`;
                if(item.type === 'system') div.classList.add('log-system');
                if(item.type === 'warning') div.classList.add('log-warning');
                termScreen.appendChild(div);
                
                // 调用双倍速字音同步打字器
                await typeCharacterByCharacter(div, item.text, 0.5);
                await new Promise(r => setTimeout(r, item.delay));
            }
        }

        async function runMTFSequence() {
            mtfScreen.style.display = 'flex';
            
            for (let line of mtfData) {
                const div = document.createElement('div');
                div.className = `mtf-text`;
                mtfScreen.appendChild(div);
                // 特遣队机器打印维持高速率
                await typeCharacterByCharacter(div, "> " + line, 0.25);
                await new Promise(r => setTimeout(r, 800));
            }

            await new Promise(r => setTimeout(r, 1500));
            mtfScreen.style.display = 'none';
            flashScreen.style.display = 'block';

            document.addEventListener('mousemove', (e) => {
                const x = e.clientX; const y = e.clientY;
                wall.style.clipPath = `circle(160px at ${x}px ${y}px)`;
                flashCursor.style.left = x + 'px'; flashCursor.style.top = y + 'px';
            });

            // 给玩家足够的探索时间后，浮现返回收容终端的出口
            setTimeout(() => {
                const exit = document.getElementById('exit-link');
                exit.style.opacity = '1';
            }, 15000);
        }
    </script>
</body>
</html>
