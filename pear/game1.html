<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>赛博记忆翻牌</title>
    <style>
        body { margin: 0; background: #000; color: #00ffff; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .glitch { font-size: 28px; font-weight: bold; text-shadow: 0 0 10px #00ffff; animation: pulse 1s infinite alternate; text-align: center; }
        .hint { color: #555; margin-top: 20px; font-size: 14px; letter-spacing: 1px; }
        @keyframes pulse { from { opacity: 0.6; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="glitch">STAGE 01: 赛博记忆翻牌<br>[ 正在破解核心算法... ]</div>
    <div class="hint">请拍击控制台或点击屏幕直接通关</div>

    <script>
        function clear() { window.parent.postMessage("STAGE_CLEAR", "*"); }
        window.addEventListener('message', e => { if (e.data === 'TRIGGER_RELEASE') clear(); });
        window.addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'Enter') clear(); });
        document.body.addEventListener('click', clear);
    </script>
</body>
</html>
