<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 赛博抓娃娃机 - 黄金平衡版</title>
    <style>
        body { 
            margin: 0; overflow: hidden; 
            background: linear-gradient(135deg, #2b00ff 0%, #ff007f 50%, #ff8800 100%); 
            font-family: 'Fusion Pixel', monospace; color: #fff; user-select: none; 
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        /* 街机风 HUD */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; pointer-events: none;
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: flex-start; z-index: 10;
        }
        .arcade-panel {
            background: rgba(15, 5, 25, 0.85); border: 3px solid; border-radius: 8px;
            padding: 10px 20px; box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 8px 20px rgba(0,0,0,0.4);
            text-align: center; min-width: 150px; text-transform: uppercase;
        }
        .score-panel { border-color: #00ffff; box-shadow: inset 0 0 20px rgba(0,255,255,0.4); }
        .target-panel { border-color: #ff0055; box-shadow: inset 0 0 20px rgba(255,0,85,0.4); }
        .panel-title { font-size: 16px; color: #ddd; letter-spacing: 2px; margin-bottom: 5px; font-weight: bold; }
        .panel-value { font-size: 26px; font-weight: 900; line-height: 1.2; }
        #status-txt { color: #00ff00; text-shadow: 0 0 10px #00ff00; transition: color 0.3s; }
        
        /* 右侧战利品收集盒 */
        #collection-box {
            position: absolute; right: 20px; top: 120px; width: 100px; height: calc(100vh - 150px);
            background: rgba(20, 0, 40, 0.7); border: 2px solid #00ffff; border-radius: 8px;
            box-shadow: inset 0 0 15px #00ffff, 0 5px 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; padding: 10px 0;
            overflow-y: hidden; z-index: 10; backdrop-filter: blur(4px);
        }
        .collection-title {
            color: #fff; font-size: 14px; font-weight: bold; text-shadow: 0 0 5px #00ffff;
            margin-bottom: 10px; border-bottom: 1px dashed #00ffff; padding-bottom: 5px; width: 80%; text-align: center;
        }
        #collection-list {
            display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%;
        }
        .collected-toy {
            font-size: 40px; filter: drop-shadow(0 4px 4px rgba(0,0,0,0.6)); 
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0) translateY(-20px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* 结算遮罩 */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 0, 20, 0.95); display: none;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
        }
        #overlay h2 { font-size: 45px; color: #ff0055; text-shadow: 0 0 20px #ff0055; margin-bottom: 20px;}
        #ov-hint { font-size: 22px; animation: blink 1.2s infinite; text-shadow: 0 0 10px #fff;}
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="arcade-panel score-panel">
            <div class="panel-title">机台状态</div>
            <div class="panel-value" id="status-txt">READY</div>
        </div>
        <div class="arcade-panel target-panel">
            <div class="panel-title">终极任务</div>
            <div class="panel-value" style="color: #ff0055; text-shadow: 0 0 10px #ff0055;">抓取蛋糕 🎂</div>
        </div>
    </div>

    <div id="collection-box">
        <div class="collection-title">收纳盒</div>
        <div id="collection-list"></div>
    </div>

    <div id="overlay">
        <h2>🎉 成功抓取大奖！</h2>
        <div id="ov-hint">拍击 或 按空格键 继续</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        // ================= 1. 引擎与高亮环境初始化 =================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x5a0044, 0.005);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 38, 80); 
        camera.lookAt(0, 8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xff00ff, 2.0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffddff, 1.5);
        dirLight.position.set(20, 60, 30);
        scene.add(dirLight);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        // ================= 2. 构建精细化机台 =================
        const machineGroup = new THREE.Group();
        scene.add(machineGroup);

        const baseGeo = new THREE.BoxGeometry(50, 4, 50);
        const baseMat = new THREE.MeshStandardMaterial({ color: 0x221133, metalness: 0.7, roughness: 0.2 });
        const base = new THREE.Mesh(baseGeo, baseMat);
        base.position.y = -2; 
        machineGroup.add(base);

        const gridHelper = new THREE.GridHelper(48, 24, 0x00ffff, 0xff00ff);
        gridHelper.position.y = 0.1;
        machineGroup.add(gridHelper);

        const chuteX = -16, chuteZ = 16, chuteSize = 14;
        const chuteGroup = new THREE.Group();
        chuteGroup.position.set(chuteX, 0, chuteZ);
        machineGroup.add(chuteGroup);

        const chuteRimGeo = new THREE.BoxGeometry(chuteSize + 2, 2, chuteSize + 2);
        const chuteRimMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.9, roughness: 0.1 });
        const chuteRim = new THREE.Mesh(chuteRimGeo, chuteRimMat);
        chuteRim.position.y = 1;
        chuteGroup.add(chuteRim);

        const holeGeo = new THREE.BoxGeometry(chuteSize - 1, 2.1, chuteSize - 1);
        const holeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const hole = new THREE.Mesh(holeGeo, holeMat);
        hole.position.y = 1;
        chuteGroup.add(hole);

        const glowPadGeo = new THREE.PlaneGeometry(chuteSize - 2, chuteSize - 2);
        const glowPadMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 });
        const glowPad = new THREE.Mesh(glowPadGeo, glowPadMat);
        glowPad.rotation.x = -Math.PI / 2;
        glowPad.position.y = 0.5;
        chuteGroup.add(glowPad);

        const pillarMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.8, roughness: 0.3 });
        const neonStripMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        
        const corners = [ [-24, -24], [24, -24], [-24, 24], [24, 24] ];
        corners.forEach(([px, pz]) => {
            const pillar = new THREE.Mesh(new THREE.BoxGeometry(2, 45, 2), pillarMat);
            pillar.position.set(px, 22.5, pz);
            machineGroup.add(pillar);
            
            const strip = new THREE.Mesh(new THREE.BoxGeometry(2.2, 43, 0.5), neonStripMat);
            strip.position.set(px, 22.5, pz > 0 ? pz - 0.8 : pz + 0.8);
            machineGroup.add(strip);
        });

        const glassMat = new THREE.MeshPhysicalMaterial({
            color: 0xffaadd, metalness: 0.8, roughness: 0.1, transmission: 0.9, transparent: true, opacity: 0.25
        });
        const backGlass = new THREE.Mesh(new THREE.BoxGeometry(48, 45, 0.5), glassMat);
        backGlass.position.set(0, 22.5, -24);
        machineGroup.add(backGlass);
        const rightGlass = new THREE.Mesh(new THREE.BoxGeometry(0.5, 45, 48), glassMat);
        rightGlass.position.set(24, 22.5, 0);
        machineGroup.add(rightGlass);

        // ================= 3. 高级 Emoji 材质生成器 (放大版) =================
        function createEmojiSprite(emoji, size = 128) {
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 8; ctx.shadowOffsetY = 5;
            ctx.font = `${size * 0.75}px "Fusion Pixel", sans-serif`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(emoji, size / 2, size / 2 + size * 0.05);

            const texture = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true }));
            sprite.scale.set(8.5, 8.5, 1); 
            return sprite;
        }

        // ================= 4. 绝对不重样的 30 个巨型娃娃生成 =================
        const toys = [];
        const uniquePool = ['🧸','🐰','🎁','🦊','🐧','🐱','🤖','🐶','🐯','🐼','🐸','🐷','🐙','🍎','🍓','🍔','🍕','🍦','🍩','🚗','🦄','🦖','🐳','🍄','🌻','🍐','🎸','🕹️','💎'];
        
        uniquePool.sort(() => Math.random() - 0.5);

        const totalToysCount = 30;

        for (let i = 0; i < totalToysCount; i++) {
            const isTarget = (i === 15);
            const icon = isTarget ? '🎂' : uniquePool.pop();
            
            const toyGroup = new THREE.Group();
            
            const sprite = createEmojiSprite(icon);
            sprite.position.y = 4; 
            toyGroup.add(sprite);

            const shadow = new THREE.Mesh(new THREE.CircleGeometry(2.5, 16), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5 }));
            shadow.rotation.x = -Math.PI / 2;
            shadow.position.y = 0.2; 
            toyGroup.add(shadow);

            let rx, rz;
            do {
                rx = (Math.random() - 0.5) * 44; 
                rz = (Math.random() - 0.5) * 44;
            } while (rx < -7 && rz > 7); 

            toyGroup.position.set(rx, 0, rz);
            
            toyGroup.userData = { 
                icon: icon, 
                isTarget: isTarget,
                isGrabbed: false, 
                bobOffset: Math.random() * Math.PI * 2,
                targetPos: new THREE.Vector3(rx, 0, rz), 
                speed: Math.random() * 0.015 + 0.005
            };
            
            scene.add(toyGroup);
            toys.push(toyGroup);
        }

        // ================= 5. 构建发光天车 =================
        const craneGroup = new THREE.Group();
        craneGroup.position.set(0, 40, 0);
        scene.add(craneGroup);

        const motorMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9, roughness: 0.2 });
        const motor = new THREE.Mesh(new THREE.BoxGeometry(6, 4, 6), motorMat);
        craneGroup.add(motor);
        const motorLight = new THREE.Mesh(new THREE.BoxGeometry(6.2, 1, 6.2), new THREE.MeshBasicMaterial({ color: 0xff0055 }));
        craneGroup.add(motorLight);

        const ropeMat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 4 });
        const ropeGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,-5,0)]);
        const rope = new THREE.Line(ropeGeo, ropeMat);
        craneGroup.add(rope);

        const clawBase = new THREE.Group();
        clawBase.position.y = -5;
        craneGroup.add(clawBase);

        const clawCenter = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 2, 16), new THREE.MeshStandardMaterial({ color: 0x00ffff, metalness: 0.5 }));
        clawBase.add(clawCenter);

        const prongs = [];
        for(let i=0; i<3; i++) {
            const prongGroup = new THREE.Group();
            prongGroup.rotation.y = (i * Math.PI * 2) / 3;
            const prongMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 8, 0.5), new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1 }));
            prongMesh.position.set(0, -3.5, 2);
            prongMesh.rotation.x = -0.4; 
            
            prongGroup.add(prongMesh);
            clawBase.add(prongGroup);
            prongs.push(prongMesh);
        }

        // ================= 6. 重度质感抓取逻辑 (黄金平衡版) =================
        let gameState = 'READY'; 
        let grabbedToy = null;
        let isWin = false;

        function updateStatus(text, color) {
            const el = document.getElementById('status-txt');
            el.innerText = text;
            el.style.color = color;
            el.style.textShadow = `0 0 10px ${color}`;
        }

        function triggerMachineSequence() {
            if (gameState !== 'READY') return;
            gameState = 'DROPPING';
            updateStatus('DROPPING...', '#ff0055');

            gsap.to(clawBase.position, {
                y: -36, 
                duration: 2.2, 
                ease: "power2.inOut",
                onUpdate: () => ropeGeo.setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0, clawBase.position.y, 0)]),
                onComplete: () => {
                    gameState = 'GRABBING';
                    updateStatus('GRABBING...', '#f1c40f');
                    
                    prongs.forEach(p => gsap.to(p.rotation, { x: 0.15, duration: 0.6, ease: "power3.out" }));

                    // 高精度 XZ 平面柱状投影检测
                    const clawWorldPos = new THREE.Vector3();
                    clawBase.getWorldPosition(clawWorldPos);

                    // 【平衡修正】：4.8 容错半径，既需要瞄准，也能爽快抓起边缘的娃娃
                    let minDistance = 4.8; 
                    let closestToy = null;

                    toys.forEach(toy => {
                        if(toy.userData.isGrabbed) return;
                        const distXZ = Math.hypot(clawWorldPos.x - toy.position.x, clawWorldPos.z - toy.position.z);
                        if(distXZ < minDistance) {
                            minDistance = distXZ;
                            closestToy = toy;
                        }
                    });

                    if(closestToy) {
                        grabbedToy = closestToy;
                        grabbedToy.userData.isGrabbed = true;
                        
                        grabbedToy.children[1].visible = false; 

                        clawBase.attach(grabbedToy);
                        
                        gsap.to(grabbedToy.position, { x: 0, y: -7.5, z: 0, duration: 0.4 });
                        
                        const sprite = grabbedToy.children[0];
                        gsap.to(sprite.scale, { x: 10, y: 10, duration: 0.2, yoyo: true, repeat: 1 }); 
                    }

                    setTimeout(() => {
                        gameState = 'LIFTING';
                        updateStatus('LIFTING...', '#ffffff');
                        gsap.to(clawBase.position, {
                            y: -5,
                            duration: 2.2,
                            ease: "power1.inOut",
                            onUpdate: () => ropeGeo.setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0, clawBase.position.y, 0)]),
                            onComplete: () => {
                                gameState = 'HOMING';
                                updateStatus('HOMING...', '#ffffff');
                                gsap.to(craneGroup.position, {
                                    x: chuteX, z: chuteZ,
                                    duration: 2.5,
                                    ease: "power2.inOut",
                                    onComplete: () => {
                                        gameState = 'RELEASING';
                                        updateStatus('RELEASE', '#00ffff');
                                        prongs.forEach(p => gsap.to(p.rotation, { x: -0.4, duration: 0.5 }));
                                        
                                        if (grabbedToy) {
                                            scene.attach(grabbedToy);
                                            gsap.to(grabbedToy.position, {
                                                y: -10, duration: 0.6, ease: "power2.in",
                                                onComplete: () => {
                                                    handleCollection(grabbedToy);
                                                    grabbedToy = null;
                                                }
                                            });
                                        } else {
                                            resetMachine();
                                        }
                                    }
                                });
                            }
                        });
                    }, 600); 
                }
            });
        }

        function handleCollection(toy) {
            scene.remove(toy);
            const index = toys.indexOf(toy);
            if(index > -1) toys.splice(index, 1);
            
            if (toy.userData.isTarget) {
                isWin = true;
                gameState = 'OVER';
                updateStatus('SUCCESS!', '#f1c40f');
                document.getElementById('overlay').style.display = 'flex';
            } else {
                updateStatus('WRONG TOY', '#ff0000');
                addToyToCollectionPanel(toy.userData.icon);
                
                setTimeout(() => {
                    resetMachine();
                }, 1000); 
            }
        }

        function addToyToCollectionPanel(icon) {
            const list = document.getElementById('collection-list');
            const el = document.createElement('div');
            el.className = 'collected-toy';
            el.innerText = icon;
            list.insertBefore(el, list.firstChild);
        }

        function resetMachine() {
            if (isWin) return;
            gameState = 'READY';
            updateStatus('READY', '#00ff00');
        }

        // ================= 7. 键盘与跨域信号通信 =================
        let isMoving = { up: false, down: false, left: false, right: false };

        window.addEventListener('message', e => {
            const msg = e.data;
            if (msg.type === "DIR_KEYDOWN") {
                if (msg.key === "dir-up") isMoving.up = true;
                if (msg.key === "dir-down") isMoving.down = true;
                if (msg.key === "dir-left") isMoving.left = true;
                if (msg.key === "dir-right") isMoving.right = true;
            }
            if (msg.type === "DIR_KEYUP") {
                if (msg.key === "dir-up") isMoving.up = false;
                if (msg.key === "dir-down") isMoving.down = false;
                if (msg.key === "dir-left") isMoving.left = false;
                if (msg.key === "dir-right") isMoving.right = false;
            }
            if (msg === 'TRIGGER_RELEASE' || msg.data === 'TRIGGER_RELEASE') {
                if (isWin) {
                    window.parent.postMessage("STAGE_CLEAR", "*");
                } else {
                    triggerMachineSequence();
                }
            }
        });

        // ================= 8. 动画与阻尼控制 =================
        const moveSpeed = 0.15; 
        const bounds = { minX: -22, maxX: 22, minZ: -22, maxZ: 22 };

        function clampToBounds(vec) {
            vec.x = Math.max(bounds.minX, Math.min(bounds.maxX, vec.x));
            vec.z = Math.max(bounds.minZ, Math.min(bounds.maxZ, vec.z));
            if (vec.x < -7 && vec.z > 7) {
                vec.x = -7;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now();

            if (gameState === 'READY') {
                if (isMoving.left) craneGroup.position.x = Math.max(bounds.minX, craneGroup.position.x - moveSpeed);
                if (isMoving.right) craneGroup.position.x = Math.min(bounds.maxX, craneGroup.position.x + moveSpeed);
                if (isMoving.up) craneGroup.position.z = Math.max(bounds.minZ, craneGroup.position.z - moveSpeed);
                if (isMoving.down) craneGroup.position.z = Math.min(bounds.maxZ, craneGroup.position.z + moveSpeed);
                
                craneGroup.position.y = 40 + Math.sin(time * 0.002) * 0.2; 
            }

            // 【平衡修正】：娃娃偶尔懒洋洋地散步
            toys.forEach(toy => {
                if(!toy.userData.isGrabbed) {
                    const ud = toy.userData;
                    
                    if (Math.random() < 0.003) { // 极低的移动意愿
                        ud.targetPos.x += (Math.random() - 0.5) * 8;
                        ud.targetPos.z += (Math.random() - 0.5) * 8;
                        clampToBounds(ud.targetPos);
                    }

                    toy.position.lerp(ud.targetPos, ud.speed);

                    const sprite = toy.children[0];
                    sprite.position.y = 4 + Math.sin(time * 0.003 + ud.bobOffset) * 0.2; 
                }
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
