<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Test 01 // Recall Matrix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #020105;
            color: #00ffff;
            font-family: ui-monospace, Consolas, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            padding: 8px 12px;
        }

        .glitch {
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffff;
            text-align: center;
        }

        .status-text {
            font-size: 14px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin-top: 5px;
            animation: pulse 1s infinite alternate;
            text-align: center;
        }
        @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }

        /* ================= 卡牌棋盘 2 行 × 8 列 ================= */
        #board {
            --gap: 8px;
            /* 卡片边长同时受「横向 8 列」和「纵向 2 行」约束，取最小值，永远等比不变形 */
            --card: min(
                150px,
                calc((100vw - 24px - 7 * var(--gap)) / 8),
                calc((100vh - 128px - var(--gap)) / 2)
            );
            display: grid;
            grid-template-columns: repeat(8, var(--card));
            grid-template-rows: repeat(2, var(--card));
            gap: var(--gap);
            margin-top: 12px;
        }

        .card { perspective: 700px; position: relative; }

        .card-inner {
            position: absolute; inset: 0;
            transform-style: preserve-3d;
            transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        .card.flipped .card-inner { transform: rotateY(180deg); }

        .card-face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* 卡背：霓虹问号 */
        .card-front {
            background:
                repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(0,255,255,0.06) 8px, rgba(0,255,255,0.06) 16px),
                linear-gradient(160deg, #12082a, #050210);
            border: 2px solid #00ffff;
            box-shadow: inset 0 0 18px rgba(0, 255, 255, 0.25), 0 0 12px rgba(0, 255, 255, 0.15);
            color: #00ffff;
            font-size: calc(var(--card) * 0.42);
            font-weight: bold;
            text-shadow: 0 0 12px #00ffff;
        }

        /* 卡面：照片 或 emoji 后备 */
        .card-back {
            transform: rotateY(180deg);
            background: #0a0518;
            border: 2px solid #ff00ff;
            box-shadow: inset 0 0 18px rgba(255, 0, 255, 0.25), 0 0 12px rgba(255, 0, 255, 0.15);
            font-size: calc(var(--card) * 0.5);
        }
        /* 图片是 1:1、卡片也是正方形，contain 保证任何像素尺寸都等比铺满且不裁切 */
        .card-back img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
        }

        /* 玩家光标 */
        .card.cursor::after {
            content: '';
            position: absolute; inset: -4px;
            border: 3px solid #ff00ff;
            border-radius: 11px;
            box-shadow: 0 0 15px #ff00ff, inset 0 0 8px rgba(255, 0, 255, 0.4);
            animation: cursorPulse 0.9s infinite alternate;
            pointer-events: none;
            z-index: 3;
        }
        @keyframes cursorPulse { from { opacity: 0.55; } to { opacity: 1; } }

        /* 配对成功的常亮金光 */
        .card.matched .card-back {
            border-color: #f1c40f;
            box-shadow: inset 0 0 18px rgba(241, 196, 15, 0.35), 0 0 18px rgba(241, 196, 15, 0.5);
        }
        .card.matched { animation: matchedPop 0.4s ease; }
        @keyframes matchedPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .hint {
            color: #aaa;
            margin-top: 12px;
            font-size: 13px;
            letter-spacing: 1px;
            text-align: center;
        }
        .highlight { color: #ff00ff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="glitch">TEST 01: RECALL MATRIX</div>
    <div class="status-text" id="status">[ PAIR ALL 8 ARCHIVED SYMBOLS ]</div>

    <div id="board"></div>

    <div class="hint"><span class="highlight">W A S D</span> MOVE · <span class="highlight">ACTION / SPACE</span> REVEAL</div>

    <script>
        // ================= 【棋盘规格】2 行 × 8 列 = 16 张 = 8 对 =================
        const COLS = 8, ROWS = 2;
        const PAIRS = COLS * ROWS / 2;   // 8

        const statusEl = document.getElementById('status');
        const boardEl = document.getElementById('board');

        // ================= 【素材】代码内置符号，无外部图片依赖 =================
        const CARD_SYMBOLS = ['◆', '●', '▲', '■', '★', '✦', '⬟', '♢'];

        // ================= 【游戏状态】 =================
        // deck[格子] = 图案编号 0~7，每种两张
        let deck = [];
        let cardEls = [];
        let cursorIndex = 0;
        let firstPick = -1;      // 第一张翻开的格子
        let lockInput = true;    // 洗牌/回翻动画期间锁输入
        let matchedCount = 0;
        let flipCount = 0;
        let isGameCleared = false;

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function buildBoard() {
            // [0,1,...,7, 0,1,...,7] 洗牌
            const base = [];
            for (let p = 0; p < PAIRS; p++) base.push(p, p);
            deck = shuffle(base);

            boardEl.innerHTML = '';
            cardEls = [];

            deck.forEach((patternId) => {
                const card = document.createElement('div');
                card.className = 'card';

                const inner = document.createElement('div');
                inner.className = 'card-inner';

                const front = document.createElement('div');
                front.className = 'card-face card-front';
                front.textContent = '?';

                const back = document.createElement('div');
                back.className = 'card-face card-back';
                back.textContent = CARD_SYMBOLS[patternId];

                inner.appendChild(front);
                inner.appendChild(back);
                card.appendChild(inner);
                boardEl.appendChild(card);
                cardEls.push(card);
            });

            cursorIndex = 0;
            updateCursor();
            lockInput = false;
            statusEl.innerText = `[ PAIR ALL ${PAIRS} ARCHIVED SYMBOLS ]`;
        }

        function updateCursor() {
            cardEls.forEach((c, i) => c.classList.toggle('cursor', i === cursorIndex && !isGameCleared));
        }

        // ================= 【核心逻辑】 =================
        function moveCursor(dr, dc) {
            if (isGameCleared) return;
            const r = Math.floor(cursorIndex / COLS) + dr;
            const c = (cursorIndex % COLS) + dc;
            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                cursorIndex = r * COLS + c;
                updateCursor();
            }
        }

        function handleAction() {
            if (isGameCleared) {
                window.parent.postMessage('STAGE_CLEAR', '*');
                return;
            }
            if (lockInput) return;

            const card = cardEls[cursorIndex];
            // 已配对或已翻开的不能再翻
            if (!card || card.classList.contains('matched') || card.classList.contains('flipped')) return;

            card.classList.add('flipped');
            flipCount++;

            if (firstPick === -1) {
                // 翻开第一张
                firstPick = cursorIndex;
                statusEl.innerText = '[ SAMPLE LOCKED — LOCATE ITS MATCH ]';
                return;
            }

            // 翻开第二张：判定
            const a = firstPick, b = cursorIndex;
            firstPick = -1;

            if (deck[a] === deck[b]) {
                // 配对成功
                cardEls[a].classList.add('matched');
                cardEls[b].classList.add('matched');
                matchedCount++;
                statusEl.innerText = `[ MATCH CONFIRMED — ${matchedCount} / ${PAIRS} ]`;

                if (matchedCount === PAIRS) {
                    isGameCleared = true;
                    updateCursor();
                    statusEl.innerText = `[ RECALL INDEX RESTORED IN ${flipCount} FLIPS — ACTION TO CONTINUE ]`;
                    statusEl.style.color = '#00ff00';
                    statusEl.style.textShadow = '0 0 10px #00ff00';
                }
            } else {
                // 配对失败：短暂展示后回翻
                lockInput = true;
                statusEl.innerText = '[ MISMATCH — SAMPLES RESEALED ]';
                setTimeout(() => {
                    cardEls[a].classList.remove('flipped');
                    cardEls[b].classList.remove('flipped');
                    lockInput = false;
                    statusEl.innerText = `[ CONTINUE SCAN — ${matchedCount} / ${PAIRS} ]`;
                }, 750);
            }
        }

        // ================= 【输入监听】与主框架协议一致 =================
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'DIR_KEYDOWN') {
                if (event.data.key === 'dir-left') moveCursor(0, -1);
                if (event.data.key === 'dir-right') moveCursor(0, 1);
                if (event.data.key === 'dir-up') moveCursor(-1, 0);
                if (event.data.key === 'dir-down') moveCursor(1, 0);
            } else if (event.data === 'TRIGGER_RELEASE') {
                handleAction();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); moveCursor(-1, 0); }
            else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); moveCursor(1, 0); }
            else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); moveCursor(0, -1); }
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); moveCursor(0, 1); }
            else if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); handleAction(); }
        }, false);

        buildBoard();
    </script>
</body>
</html>
